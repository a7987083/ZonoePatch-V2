name: ZonoePatch V2 iOS Build
on:
  push:
    branches: ['dev/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Source contracts
        run: |
          python3 iosruntimepatchmenu/tests/retained_hook_contract.py
          bash iosruntimepatchmenu/tests/single_ui_owner_contract.sh
          python3 iosruntimepatchmenu/tests/znunifiedui_topology_audit.py --report topology.json
      - name: Portable scalar tests
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror -Iiosruntimepatchmenu/src iosruntimepatchmenu/tests/scalar_parser_test.cpp -o /tmp/scalar-test
          /tmp/scalar-test
          clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -Iiosruntimepatchmenu/src iosruntimepatchmenu/tests/checked_layout_test.cpp -o /tmp/layout-test
          /tmp/layout-test
      - name: Strict ownership module warnings
        run: bash scripts/check-module-warnings.sh
      - name: Foundation baseline tests
        run: |
          set -euo pipefail
          clang++ -std=c++17 -fobjc-arc -framework Foundation -Iiosruntimepatchmenu/src iosruntimepatchmenu/tests/il2cpp_runtime_common_test.mm -o /tmp/common-test
          /tmp/common-test
          clang++ -std=c++17 -fobjc-arc -framework Foundation -Iiosruntimepatchmenu/src iosruntimepatchmenu/tests/native_hook_template_test.mm -o /tmp/hook-test
          /tmp/hook-test
          clang++ -std=gnu++17 -fobjc-arc -fblocks -framework Foundation -Iiosruntimepatchmenu/src iosruntimepatchmenu/src/ZNNativeHookScheduler.mm iosruntimepatchmenu/tests/native_hook_scheduler_test.mm -o /tmp/scheduler-test
          /tmp/scheduler-test
          clang++ -std=c++17 -fobjc-arc -framework Foundation -Iiosruntimepatchmenu/src iosruntimepatchmenu/src/ZNBuildOutputIO.mm iosruntimepatchmenu/tests/build_output_io_test.mm -o /tmp/output-test
          /tmp/output-test
          clang++ -std=gnu++17 -fobjc-arc -fblocks -framework Foundation -Iiosruntimepatchmenu/src iosruntimepatchmenu/src/ZNActivationStageRunner.mm iosruntimepatchmenu/tests/activation_stage_runner_test.mm -o /tmp/activation-test
          /tmp/activation-test
          clang++ -std=gnu++17 -fobjc-arc -fblocks -framework Foundation -Iiosruntimepatchmenu/src iosruntimepatchmenu/src/ZNBuildSession.mm iosruntimepatchmenu/src/ZNBuildWorkspaceSnapshot.mm iosruntimepatchmenu/src/ZNBinaryPatchRow.mm iosruntimepatchmenu/src/ZNRuntimeActionModel.mm iosruntimepatchmenu/src/ZNNativeHookAction.mm iosruntimepatchmenu/src/ZNIL2CPPMethodSignature.mm iosruntimepatchmenu/src/ZNIL2CPPABIMetadata.mm iosruntimepatchmenu/src/ZNValueTypeModel.mm iosruntimepatchmenu/src/ZNComplexStructCodec.mm iosruntimepatchmenu/tests/build_session_test.mm -o /tmp/build-session-test
          /tmp/build-session-test
          clang++ -std=gnu++17 -fobjc-arc -fblocks -framework Foundation -Iiosruntimepatchmenu/src iosruntimepatchmenu/src/ZNIL2CPPABIMetadata.mm iosruntimepatchmenu/tests/il2cpp_abi_classifier_test.mm -o /tmp/abi-test
          /tmp/abi-test
          clang++ -std=c++17 -fobjc-arc -framework Foundation -Iiosruntimepatchmenu/src iosruntimepatchmenu/src/ZNBuildRouterShadow.mm iosruntimepatchmenu/tests/build_router_shadow_test.mm -o /tmp/router-test
          /tmp/router-test
          clang++ -std=c++17 -fobjc-arc -framework Foundation -Iiosruntimepatchmenu/src iosruntimepatchmenu/src/ZNFeatureMetadataCodec.mm iosruntimepatchmenu/tests/feature_metadata_codec_test.mm -o /tmp/metadata-test
          /tmp/metadata-test
          clang++ -std=gnu++17 -fobjc-arc -fblocks -Wall -Wextra -Werror -framework Foundation -Iiosruntimepatchmenu/src iosruntimepatchmenu/src/ZNRuntimeLogger.mm iosruntimepatchmenu/tests/runtime_logger_test.mm -o /tmp/logger-test
          /tmp/logger-test
      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          brew install ldid cmake
          git clone https://github.com/theos/theos.git "$HOME/theos"
          git -C "$HOME/theos" checkout 304e0799973e8145f32e4ca2de6c747a84b758ce
          git -C "$HOME/theos" submodule update --init --recursive
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          mkdir -p vendor
          git clone https://github.com/jmpews/Dobby.git vendor/Dobby
          git -C vendor/Dobby checkout 5dfc8546954ce3b3198132ab13fddb89ee92cdd7
          python3 - <<'PY'
          from pathlib import Path
          p=Path('vendor/Dobby/scripts/platform_builder.py')
          p.write_text(p.read_text().replace('import pipes\n',''))
          p=Path('vendor/Dobby/include/dobby.h'); s=p.read_text()
          old='#ifdef __cplusplus\nextern "C" {\n#endif\n\n#include <stdbool.h>\n#include <stdint.h>\n#include <sys/types.h>\n'
          new='#include <stdbool.h>\n#include <stdint.h>\n#include <sys/types.h>\n\n#ifdef __cplusplus\nextern "C" {\n#endif\n'
          if old not in s: raise SystemExit('unexpected pinned Dobby header')
          p.write_text(s.replace(old,new,1))
          PY
          (cd vendor/Dobby && python3 scripts/platform_builder.py --platform iphoneos --arch arm64 --library_build_type static)
          test -f vendor/Dobby/build/iphoneos/arm64/libdobby.a
      - name: Build and verify arm64 dylib
        run: bash scripts/build-ios.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ZonoePatch-V2-${{ github.sha }}
          path: |
            dist/
            build-ios.log
            topology.json
          if-no-files-found: error

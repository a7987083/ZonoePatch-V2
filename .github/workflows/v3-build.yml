name: ZonoePatch V3 arm64 Build
on:
  push:
    branches:
      - ZonoePatch-V3
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "18.5"
      - name: Install Theos
        run: |
          set -euo pipefail
          brew install ldid
          command -v ldid
          git clone https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          git -C "$RUNNER_TEMP/theos" checkout 304e0799973e8145f32e4ca2de6c747a84b758ce
          git -C "$RUNNER_TEMP/theos" submodule update --init --recursive
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
      - name: Build dylib
        run: |
          set -euo pipefail
          make clean
          make FINALPACKAGE=1 2>&1 | tee build.log
          mkdir -p dist
          cp .theos/obj/ZonoePatchV3.dylib dist/ZonoePatch-V3-arm64.dylib
          file dist/ZonoePatch-V3-arm64.dylib
          shasum -a 256 dist/ZonoePatch-V3-arm64.dylib > dist/SHA256.txt
          xcrun lipo -info dist/ZonoePatch-V3-arm64.dylib
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ZonoePatch-V3-${{ github.sha }}
          path: |
            dist/
            build.log
          if-no-files-found: warn

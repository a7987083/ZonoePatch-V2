name: ZonoePatch V3 arm64 Build
on:
  push:
    branches:
      - ZonoePatch-V3
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "18.5"
      - name: Test Patch Codec
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++ -std=c++17 -fobjc-arc -framework Foundation \
            V3PatchCodec.mm tests/v3_patch_codec_test.mm -o "$RUNNER_TEMP/v3_codec_test"
          "$RUNNER_TEMP/v3_codec_test"
      - name: Test Typed Value Codec
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++ -std=c++17 -Wall -Wextra -Werror \
            ZNValueCodec.cpp tests/zn_value_codec_test.cpp -o "$RUNNER_TEMP/zn_value_codec_test"
          "$RUNNER_TEMP/zn_value_codec_test"
      - name: Test Typed Descriptor Contract
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++ -std=c++17 -Wall -Wextra -Werror \
            ZNValueCodec.cpp ZNTypedDescriptor.cpp tests/zn_typed_descriptor_test.cpp \
            -o "$RUNNER_TEMP/zn_typed_descriptor_test"
          "$RUNNER_TEMP/zn_typed_descriptor_test"
      - name: Test Address and Configuration
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++ -std=c++17 -fobjc-arc -framework Foundation \
            V3AddressResolver.mm V3ModuleResolver.mm V3PatchCodec.mm \
            V3ConfigRepository.mm V3FeatureModels.mm \
            tests/v3_config_and_address_test.mm -o "$RUNNER_TEMP/v3_address_config_test"
          "$RUNNER_TEMP/v3_address_config_test"
      - name: Test Executor Transactions
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++ -std=c++17 -fobjc-arc -framework Foundation \
            V3RuntimePatchExecutor.mm tests/v3_runtime_executor_test.mm -o "$RUNNER_TEMP/v3_executor_test"
          "$RUNNER_TEMP/v3_executor_test"
      - name: Test Static Build Plan
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++ -std=c++17 -fobjc-arc -framework Foundation \
            V3StaticBuildPlan.mm tests/v3_static_build_planner_test.mm -o "$RUNNER_TEMP/v3_static_plan_test"
          "$RUNNER_TEMP/v3_static_plan_test"
      - name: Test P6 Generated Mach-O and Signature
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++ -std=c++17 -fobjc-arc -framework Foundation \
            V3StaticBuildPlan.mm V3StaticBinaryBuilder.mm ZNAdhocMachOSigner.mm \
            tests/v3_static_binary_smoke_test.mm -o "$RUNNER_TEMP/v3_static_binary_smoke"
          "$RUNNER_TEMP/v3_static_binary_smoke"
      - name: Test P6 Static Slot Transactions
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++ -std=c++17 -fobjc-arc -framework Foundation \
            V3StaticSlotTransaction.mm tests/v3_static_slot_transaction_test.mm -o "$RUNNER_TEMP/v3_static_slot_tx"
          "$RUNNER_TEMP/v3_static_slot_tx"
      - name: Install Theos
        run: |
          set -euo pipefail
          brew install ldid
          command -v ldid
          git clone https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          git -C "$RUNNER_TEMP/theos" checkout 304e0799973e8145f32e4ca2de6c747a84b758ce
          git -C "$RUNNER_TEMP/theos" submodule update --init --recursive
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
      - name: Build dylib
        run: |
          set -euo pipefail
          make clean
          make FINALPACKAGE=1 2>&1 | tee build.log
          mkdir -p dist
          cp .theos/obj/ZonoePatchV3.dylib dist/ZonoePatch-V3-arm64.dylib
          cp .theos/obj/ZonoePatchCustomer.dylib dist/ZonoePatch-Customer-arm64.dylib
          ldid -S dist/ZonoePatch-V3-arm64.dylib
          ldid -S dist/ZonoePatch-Customer-arm64.dylib
          ldid -h dist/ZonoePatch-Customer-arm64.dylib
          file dist/ZonoePatch-Customer-arm64.dylib
          xcrun lipo -info dist/ZonoePatch-Customer-arm64.dylib
          ldid -h dist/ZonoePatch-V3-arm64.dylib
          file dist/ZonoePatch-V3-arm64.dylib
          shasum -a 256 dist/ZonoePatch-V3-arm64.dylib > dist/SHA256.txt
          xcrun lipo -info dist/ZonoePatch-V3-arm64.dylib
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ZonoePatch-V3-${{ github.sha }}
          path: |
            dist/
            build.log
          if-no-files-found: warn
